[package]
name = "sully"
version = "3192.5.14"
edition = "2024"
description = "Downloads the highest quality cover artwork from Apple Music"
license = "EUPL-1.2"

[lints.clippy]
pedantic = "warn"
style = "warn"
many_single_char_names = "warn"
min_ident_chars = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["blocking"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
url = "2.5.8"
